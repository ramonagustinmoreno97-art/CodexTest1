<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Simple</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.7);
        --primary: #22d3ee;
        --primary-2: #6366f1;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 30% 20%, #1d4ed8 0%, transparent 35%),
          radial-gradient(circle at 70% 80%, #7c3aed 0%, transparent 30%),
          var(--bg);
      }

      .calculator {
        width: min(92vw, 360px);
        padding: 1.2rem;
        border-radius: 1.2rem;
        background: var(--panel);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      .title {
        margin: 0 0 0.8rem;
        font-size: 0.95rem;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .display {
        width: 100%;
        border: 0;
        border-radius: 0.8rem;
        padding: 1rem;
        margin-bottom: 0.9rem;
        text-align: right;
        font-size: 2rem;
        color: var(--text);
        background: rgba(2, 6, 23, 0.85);
      }

      .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.55rem;
      }

      button {
        border: 0;
        padding: 0.9rem;
        border-radius: 0.8rem;
        color: var(--text);
        font-size: 1.02rem;
        cursor: pointer;
        background: rgba(148, 163, 184, 0.16);
        transition: transform 0.08s ease, filter 0.18s ease;
      }

      button:hover {
        filter: brightness(1.14);
      }

      button:active {
        transform: scale(0.97);
      }

      .operator {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(34, 211, 238, 0.9));
      }

      .equal {
        grid-column: span 2;
        background: linear-gradient(135deg, #14b8a6, #22d3ee);
        font-weight: 700;
      }

      .clear {
        background: rgba(239, 68, 68, 0.9);
      }
    </style>
  </head>
  <body>
    <main class="calculator">
      <h1 class="title">Calculadora</h1>
      <input id="display" class="display" value="0" readonly aria-label="Pantalla de la calculadora" />
      <section class="keys" aria-label="Teclado de calculadora">
        <button class="clear" data-value="C">C</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">×</button>
        <button class="operator" data-value="sqrt">√</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="+">+</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value=".">.</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value="0">0</button>

        <button class="equal" data-value="=">=</button>
      </section>
    </main>

    <script>
      const display = document.getElementById('display');
      const keys = document.querySelector('.keys');

      let expression = '';

      const updateDisplay = (value) => {
        display.value = value || '0';
      };

      const evaluateExpression = () => {
        const sanitized = expression.replace(/[^0-9+*/.]/g, "");
        return Function(`"use strict"; return (${sanitized})`)();
      };

      const calculate = () => {
        if (!expression) return;
        try {
          const result = evaluateExpression();
          expression = Number.isFinite(result) ? String(Number(result.toFixed(8))) : "";
          updateDisplay(expression || "Error");
        } catch {
          expression = "";
          updateDisplay("Error");
        }
      };

      keys.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        const { value } = button.dataset;

        if (value === 'C') {
          expression = '';
          updateDisplay('0');
          return;
        }

        if (value === '=') {
          calculate();
          return;
        }

        if (value === "sqrt") {
          try {
            const baseValue = expression ? evaluateExpression() : Number(display.value);
            const result = Math.sqrt(baseValue);
            expression = Number.isFinite(result) ? String(Number(result.toFixed(8))) : "";
            updateDisplay(expression || "Error");
          } catch {
            expression = "";
            updateDisplay("Error");
          }
          return;
        }

        expression += value;
        updateDisplay(expression);
      });
    </script>
  </body>
</html>
